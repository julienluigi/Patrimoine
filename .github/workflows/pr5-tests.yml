name: PR5 full test suite

on:
  push:
    branches:
      - 'ci/pr5-tests'

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run the full test suite
        shell: bash
        run: |
          set -o pipefail
          npm test -- --reporter=verbose 2>&1 | tee full-suite.log
      - name: Retain test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-log
          path: full-suite.log
          if-no-files-found: warn
          retention-days: 3
