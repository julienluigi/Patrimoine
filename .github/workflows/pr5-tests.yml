name: PR5 full test suite

on:
  push:
    branches:
      - 'ci/pr5-tests'

permissions:
  contents: read
  pull-requests: write

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund 2>&1 | tee full-suite.log
        shell: bash
      - name: Run the full test suite
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test -- --reporter=verbose 2>&1 | tee -a full-suite.log
      - name: Post a short summary on the internal PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Resultat de la suite complete'
            echo
            echo "Statut de l'etape de tests : ${{ steps.tests.outcome }}"
            echo
            echo '```'
            grep -E 'FAIL|AssertionError|Error|Test Files|Tests ' full-suite.log | head -n 80
            echo '```'
          } > summary.md
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head ci/pr5-tests --json number --jq '.[0].number')
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file summary.md
